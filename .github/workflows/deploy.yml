name: Deploy http-player

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: deploy-http-player
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to server via SFTP
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload files to server
        uses: wlixcc/SFTP-Deploy-Action@v1.2.6
        with:
          server: ${{ secrets.SFTP_SERVER }}
          username: ${{ secrets.SFTP_USERNAME }}
          # Key auth, not password: the server set PasswordAuthentication no on
          # 2026-09-14 (/etc/ssh/sshd_config.d/01-no-password-auth.conf), which
          # broke every deploy here with "Permission denied (publickey)".
          ssh_private_key: ${{ secrets.SFTP_PRIVATE_KEY }}
          port: ${{ secrets.SFTP_PORT }}
          # Uploads index.html, css/ and js/ (dotfiles like .git/.github are excluded by ./*)
          local_path: './*'
          remote_path: '/var/www/http-player'
          sftp_only: true
          # Keep false so the server's untracked "cloudflare-worker" folder is preserved.
          delete_remote_files: false
