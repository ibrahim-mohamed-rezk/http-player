<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BeePlayer - مشغل الفيديو</title>
    <meta name="description" content="BeePlayer - مشغل IPTV مباشر">
    <meta name="referrer" content="no-referrer">
    <!-- ?v= is required, not cosmetic: nginx serves css/js here with
         "expires 7d, immutable", so an unversioned URL keeps returning viewers
         on the cached copy for a week with no revalidation. Bump on every
         change to this file's assets. -->
    <link rel="stylesheet" href="css/style.css?v=2">
    <!-- HLS.js for .m3u8 streams -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
    <!-- mpegts.js for .ts streams -->
    <script src="https://cdn.jsdelivr.net/npm/mpegts.js@1.7.3/dist/mpegts.min.js"></script>
</head>
<body>
    <!-- Loading Screen -->
    <div id="loading-screen" class="loading-screen">
        <div class="spinner"></div>
        <p class="loading-text">جاري التحميل...</p>
    </div>

    <!-- Error Screen -->
    <div id="error-screen" class="error-screen hidden">
        <div class="error-card">
            <div id="error-icon" class="error-icon">⚠️</div>
            <h2 id="error-title" class="error-title">خطأ في التشغيل</h2>
            <p id="error-message" class="error-message">يوجد خطأ من مصدر البث</p>
            <p id="error-detail" class="error-detail hidden"></p>
            <div class="error-actions">
                <button id="error-close" class="btn btn-secondary" onclick="window.close()">
                    ✕ إغلاق
                </button>
            </div>
        </div>
    </div>

    <!-- Player Container -->
    <div id="player-container" class="player-container hidden">
        <!-- Title Bar -->
        <div id="title-bar" class="title-bar">
            <div class="title-bar-content">
                <span class="bee-logo">🐝 BeePlayer</span>
                <h1 id="video-title" class="video-title">مشغل الفيديو</h1>
                <a id="back-link" class="back-btn" href="#" onclick="goBack()">← Back</a>
            </div>
        </div>

        <!-- Video Element -->
        <div class="video-wrapper" id="video-wrapper">
            <video id="video-player" playsinline></video>

            <!-- Controls Overlay -->
            <div id="controls" class="controls" dir="ltr">
                <div class="controls-top">
                    <div class="progress-container">
                        <input type="range" id="progress-bar" class="progress-bar" min="0" max="100" value="0" step="0.1">
                        <div class="time-display">
                            <span id="current-time">0:00</span>
                            <span id="duration">0:00</span>
                        </div>
                    </div>
                </div> 
                <div class="controls-bottom">
                    <div class="controls-left">
                        <button id="play-btn" class="control-btn" onclick="togglePlay()">
                            <svg id="play-icon" width="28" height="28" viewBox="0 0 24 24" fill="white"><polygon points="5 3 19 12 5 21 5 3"/></svg>
                            <svg id="pause-icon" width="28" height="28" viewBox="0 0 24 24" fill="white" class="hidden"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
                        </button>
                        <button class="control-btn" onclick="skip(-10)">
                            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><path d="M2.5 2v6h6"/><path d="M2.5 8A10 10 0 1 1 4.34 16.2"/></svg>
                            <span class="skip-label">10</span>
                        </button>
                        <button class="control-btn" onclick="skip(10)">
                            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><path d="M21.5 2v6h-6"/><path d="M21.5 8A10 10 0 1 0 19.66 16.2"/></svg>
                            <span class="skip-label">10</span>
                        </button>
                        <div class="volume-container">
                            <button class="control-btn" onclick="toggleMute()">
                                <svg id="volume-icon" width="22" height="22" viewBox="0 0 24 24" fill="white"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07" fill="none" stroke="white" stroke-width="2"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14" fill="none" stroke="white" stroke-width="2"/></svg>
                                <svg id="mute-icon" width="22" height="22" viewBox="0 0 24 24" fill="white" class="hidden"><path d="M11 5L6 9H2v6h4l5 4V5z"/><line x1="23" y1="9" x2="17" y2="15" stroke="white" stroke-width="2"/><line x1="17" y1="9" x2="23" y2="15" stroke="white" stroke-width="2"/></svg>
                            </button>
                            <input type="range" id="volume-bar" class="volume-bar" min="0" max="100" value="100">
                        </div>
                    </div>
                    <div class="controls-right">
                        <button class="control-btn" onclick="toggleFullscreen()">
                            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M21 8V5a2 2 0 0 0-2-2h-3"/><path d="M3 16v3a2 2 0 0 0 2 2h3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/></svg>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Loaded before player.js so window.onerror is installed first. -->
    <script src="js/error-reporter.js?v=2"></script>
    <script src="js/player.js?v=16"></script>
</body>
</html>
